apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:

  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          requests:
            cpu: "300m"
            memory: "50Mi"
          limits:
            cpu: "500m"
            memory: "100Mi"
